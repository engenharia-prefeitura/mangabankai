<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="text/javascript">
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    const key = urlParams.get('key');
    
    if (type === 'native') {
      const host = urlParams.get('host') || 'pl30096193.effectivecpmnetwork.com';
      const div = document.createElement('div');
      div.id = `container-${key}`;
      document.body.appendChild(div);
      
      const s = document.createElement('script');
      s.async = true;
      s.setAttribute('data-cfasync', 'false');
      s.src = `https://${host}/${key}/invoke.js`;
      document.body.appendChild(s);
    } else {
      const w = parseInt(urlParams.get('w'), 10) || 0;
      const h = parseInt(urlParams.get('h'), 10) || 0;
      
      window.atOptions = {
        'key' : key,
        'format' : 'iframe',
        'height' : h,
        'width' : w,
        'params' : {}
      };
      
      const s = document.createElement('script');
      s.type = 'text/javascript';
      s.src = `https://www.highperformanceformat.com/${key}/invoke.js`;
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
